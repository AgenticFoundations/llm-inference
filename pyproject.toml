[project]
name = "llm-inference"
version = "0.1.0"
description = "On-demand native Ollama and authenticated local inference"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1.1,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_inference"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pyyaml>=6,<7", "mypy>=1.15,<2"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
cache_dir = ".runtime/mypy_cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
